services:
  - type: web
    name: faith-connect-church
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Faith Connect Church"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: sqlite
      - key: RUN_MIGRATIONS
        value: "true"

  # To attach a managed PostgreSQL database, uncomment the lines below:
  #     - key: DB_CONNECTION
  #       value: pgsql
  #     - key: DB_URL
  #       fromDatabase:
  #         name: faith-connect-db
  #         property: connectionString
  #
  # databases:
  #   - name: faith-connect-db
  #     databaseName: church
  #     user: church_user
  #     plan: free
